<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>ประกาศข่าวสาร | Go Wholesale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>เมนูหลัก</a>
  <div class="head"><h1>ประกาศข่าวสาร</h1><p class="sub">ประกาศและกฎระเบียบล่าสุดจากสาขา · แก้เนื้อหาในไฟล์ js/data.js</p></div>
  <div class="chips" id="chips" role="group" aria-label="กรองหมวด"></div>
  <div class="stack" id="items"></div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var $ = GW.el, tone = { 'สำคัญ': 't-amber', 'ระเบียบ': 't-blue', 'ทั่วไป': 't-gray' }, cur = 'ทั้งหมด';
  var cats = ['ทั้งหมด', 'สำคัญ', 'ระเบียบ', 'ทั่วไป'];
  function draw() {
    $('chips').innerHTML = cats.map(function (c) { return '<button type="button" class="chip" aria-pressed="' + (c === cur) + '" data-c="' + c + '">' + c + '</button>'; }).join('');
    $('items').innerHTML = GW_DATA.news.filter(function (n) { return cur === 'ทั้งหมด' || n.tag === cur; }).map(function (n) {
      return '<article class="card stack" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill ' + (tone[n.tag] || 't-gray') + '">' + GW.esc(n.tag) + '</span><span class="sub">' + GW.esc(n.date) + '</span></div><h2>' + GW.esc(n.title) + '</h2><p style="font-size:14px;line-height:1.55;color:var(--fg-2)">' + GW.esc(n.body) + '</p></article>';
    }).join('') || '<div class="empty">ไม่มีประกาศในหมวดนี้</div>';
  }
  $('chips').addEventListener('click', function (e) { var c = e.target.getAttribute('data-c'); if (c) { cur = c; draw(); } });
  draw();
})();
</script>
</body>
</html>
