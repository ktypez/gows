<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>ลงทะเบียนพนักงาน | Go Wholesale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>เมนูหลัก</a>
  <div class="head">
    <h1>ลงทะเบียนพนักงาน</h1>
    <p class="sub" id="conn"></p>
  </div>

  <form id="form" class="stack" style="gap:14px" autocomplete="off" novalidate>
    <div class="field"><label for="f-name">ชื่อ-นามสกุล (จริง)</label><input id="f-name" type="text" autocomplete="name" placeholder="เช่น สมชาย ใจดี" required></div>
    <div class="field"><label for="f-nick">ชื่อเล่น</label><input id="f-nick" type="text" placeholder="เช่น ชาย"></div>
    <div class="field"><label for="f-plate">ทะเบียนรถ</label><input id="f-plate" type="text" placeholder="เช่น 1กข 2345" required></div>
    <div class="field"><label for="f-branch">สังกัด / สาขา</label><input id="f-branch" type="text" placeholder="เช่น สาขาบางนา"></div>
    <div class="field"><label for="f-sts">รหัสผู้ใช้ STS</label><input id="f-sts" type="text" autocapitalize="none" placeholder="ถ้ามี"></div>
    <div class="field"><label for="f-tel">เบอร์โทรศัพท์</label><input id="f-tel" type="tel" inputmode="tel" placeholder="08x-xxx-xxxx"></div>

    <div class="stack" style="gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>บันทึกใบหน้า 3 มุม</h2><b class="num" style="color:var(--accent-text)"><span id="cnt">0</span>/3</b></div>
      <div class="camera" id="cam" hidden><video id="video" playsinline muted></video><div class="cap" id="cap"></div></div>
      <div class="grid3" id="slots"></div>
      <p class="sub">ถ่ายในที่สว่าง ไม่สวมแว่นดำหรือหมวก ระบบเก็บเฉพาะตัวเลขแทนใบหน้า (ลายนิ้วมือใบหน้า) กับรูปเล็ก 1 รูป</p>
      <button type="button" class="btn" id="shot">เปิดกล้อง</button>
    </div>

    <p id="err" class="err" role="alert" hidden></p>
    <button type="submit" class="btn primary spacer" id="save" disabled>บันทึกการลงทะเบียน</button>
  </form>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/face.js"></script>
<script>
(function () {
  var $ = GW.el, stream = null, shots = [], thumbs = [], busy = false;
  var LABELS = ['หน้าตรง', 'หันซ้ายเล็กน้อย', 'หันขวาเล็กน้อย'];
  $('conn').textContent = GW.config().apiUrl ? 'เชื่อมต่อฐานข้อมูลกลางแล้ว' : 'ยังไม่ได้เชื่อมต่อฐานข้อมูลกลาง ข้อมูลจะอยู่ในเครื่องนี้เท่านั้น';

  function drawSlots() {
    $('slots').innerHTML = LABELS.map(function (l, i) {
      return thumbs[i] ? '<div class="slot done"><img alt="' + l + '" src="' + thumbs[i] + '"></div>'
        : '<div class="slot"><span>' + l + '</span></div>';
    }).join('');
    $('cnt').textContent = shots.length;
    $('shot').textContent = !stream ? (shots.length ? 'เปิดกล้องถ่ายต่อ' : 'เปิดกล้อง')
      : shots.length >= 3 ? 'ถ่ายครบแล้ว ถ่ายใหม่' : 'ถ่ายมุมถัดไป: ' + LABELS[shots.length];
    check();
  }
  function check() { $('save').disabled = !(shots.length >= 3 && $('f-name').value.trim() && $('f-plate').value.trim()); }
  ['f-name', 'f-plate'].forEach(function (id) { $(id).addEventListener('input', check); });

  function err(m) { $('err').textContent = m; $('err').hidden = !m; }

  $('shot').onclick = async function () {
    if (busy) return;
    err('');
    busy = true;
    try {
      if (!stream) {
        $('cam').hidden = false; $('cap').textContent = 'กำลังเปิดกล้อง…';
        var load = GWFace.load();
        stream = await GWFace.startCamera($('video'));
        $('cap').textContent = 'กำลังโหลดระบบจดจำใบหน้า…';
        await load;
        $('cap').textContent = 'พร้อมถ่าย';
        drawSlots();
        return;
      }
      if (shots.length >= 3) { shots = []; thumbs = []; }
      $('cap').textContent = 'กำลังตรวจใบหน้า…';
      var d = await GWFace.descriptor($('video'));
      if (!d) { err('ไม่พบใบหน้าในภาพ ลองมองกล้องตรงๆ ในที่สว่าง'); $('cap').textContent = 'พร้อมถ่าย'; return; }
      shots.push(d); thumbs.push(GWFace.snapshot($('video'), 160));
      $('cap').textContent = shots.length >= 3 ? 'ถ่ายครบแล้ว' : 'พร้อมถ่ายมุมถัดไป';
      if (shots.length >= 3) { GWFace.stop(stream); stream = null; $('cam').hidden = true; }
    } catch (e) {
      err(e && e.name === 'NotAllowedError' ? 'ไม่ได้รับอนุญาตใช้กล้อง เปิดสิทธิ์กล้องในเบราว์เซอร์แล้วลองใหม่' : 'เปิดกล้องหรือโหลดระบบจดจำใบหน้าไม่สำเร็จ');
      GWFace.stop(stream); stream = null; $('cam').hidden = true;
    } finally { busy = false; drawSlots(); }
  };

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = $('f-name').value.trim();
    if (GW.employees().some(function (e) { return e.name === name; }) && !confirm_replace(name)) return;
    GW.addEmployee({
      name: name, nick: $('f-nick').value.trim(), plate: $('f-plate').value.trim(),
      branch: $('f-branch').value.trim(), sts: $('f-sts').value.trim(), phone: $('f-tel').value.trim(),
      descriptors: shots, photo: thumbs[0], createdAt: new Date().toISOString()
    });
    GW.toast('บันทึกแล้ว: ' + name);
    $('form').reset(); shots = []; thumbs = []; drawSlots();
  });
  /* confirm() is blocked in some in-app browsers, so replacing a person needs a second tap instead. */
  var replaceName = '';
  function confirm_replace(name) {
    if (replaceName === name) { replaceName = ''; return true; }
    replaceName = name;
    err('มีชื่อ "' + name + '" อยู่แล้ว กดบันทึกอีกครั้งเพื่อแทนที่ข้อมูลเดิม');
    return false;
  }
  window.addEventListener('pagehide', function () { GWFace.stop(stream); });
  drawSlots();
})();
</script>
</body>
</html>
